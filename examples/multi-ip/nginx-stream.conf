# nginx-stream: target=2001:db8::10
stream {
	access_log off;

	# max_fails=0: a short failure must not take one address of a dual-stack domain out

	upstream udp_2001_db8__20_443 {
		server [2001:db8::20]:443 max_fails=0;
	}

	# reuseport: else one client's datagrams spread over workers and the server sees mixed sessions
	server {
		listen 192.0.2.20:443 udp reuseport rcvbuf=16m sndbuf=16m;
		proxy_pass udp_2001_db8__20_443;
		proxy_timeout 10m;
	}

	upstream udp_2001_db8__21_443 {
		server [2001:db8::21]:443 max_fails=0;
	}

	server {
		listen 192.0.2.21:443 udp reuseport rcvbuf=16m sndbuf=16m;
		proxy_pass udp_2001_db8__21_443;
		proxy_bind 2001:db8::5;	# outgoing address
		proxy_timeout 10m;
	}

	upstream tcp_2001_db8__10_443 {
		server [2001:db8::10]:443 max_fails=0;
	}

	server {
		listen 192.0.2.20:443 so_keepalive=on backlog=65535;
		proxy_pass tcp_2001_db8__10_443;
		proxy_connect_timeout 5s;
		proxy_timeout 10m;	# closes idle connections
		proxy_socket_keepalive on;
		proxy_buffer_size 64k;	# default 16k: extra syscalls on a fat stream
	}

	upstream tcp_203_0_113_10_443 {
		server 203.0.113.10:443 max_fails=0;
	}

	server {
		listen [2001:db8::1]:8443 so_keepalive=on backlog=65535;
		proxy_pass tcp_203_0_113_10_443;
		proxy_bind 192.0.2.20;	# outgoing address
		proxy_connect_timeout 5s;
		proxy_timeout 10m;	# closes idle connections
		proxy_socket_keepalive on;
		proxy_buffer_size 64k;	# default 16k: extra syscalls on a fat stream
	}

	upstream tcp_203_0_113_20_22 {
		server 203.0.113.20:22 max_fails=0;
	}

	server {
		listen 2222 so_keepalive=on backlog=65535;
		listen [::]:2222 so_keepalive=on backlog=65535;
		proxy_pass tcp_203_0_113_20_22;
		proxy_connect_timeout 5s;
		proxy_timeout 10m;	# closes idle connections
		proxy_socket_keepalive on;
		proxy_buffer_size 64k;	# default 16k: extra syscalls on a fat stream
	}
}
