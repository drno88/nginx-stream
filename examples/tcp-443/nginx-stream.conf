# nginx-stream: target=2001:db8::10
stream {
	access_log off;

	# max_fails=0: if a domain gives both IPv4 and IPv6, without it nginx takes one address out for
	# fail_timeout after a short failure and sends everybody to the other; the client retries a dropped connection

	upstream tcp_2001_db8__10_443 {
		server [2001:db8::10]:443 max_fails=0;
	}

	server {
		listen 443 so_keepalive=on backlog=65535;
		listen [::]:443 so_keepalive=on backlog=65535;
		proxy_pass tcp_2001_db8__10_443;
		proxy_connect_timeout 5s;
		proxy_timeout 10m;	# idle without a single byte: close
		proxy_socket_keepalive on;
		proxy_buffer_size 64k;	# default 16k: extra syscalls on a fat stream
	}
}
