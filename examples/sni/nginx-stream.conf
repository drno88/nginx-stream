# nginx-stream: target=203.0.113.9
stream {
	access_log off;

	map_hash_bucket_size 128;	# room for long host names in the maps

	# max_fails=0: a short failure must not take one address of a dual-stack domain out

	upstream tcp_2001_db8__10_443 {
		server [2001:db8::10]:443 max_fails=0;
	}

	upstream tcp_203_0_113_5_443 {
		server 203.0.113.5:443 max_fails=0;
	}

	upstream tcp_203_0_113_9_443 {
		server 203.0.113.9:443 max_fails=0;
	}

	# SNI picks the destination; no name, another name or not TLS goes to default
	map $ssl_preread_server_name $ns_up_tcp_443 {
		hostnames;
		default          tcp_203_0_113_9_443;
		a.example.com    tcp_2001_db8__10_443;
		*.b.example.com  tcp_203_0_113_5_443;
	}

	# outgoing address (@) per name
	map $ssl_preread_server_name $ns_src_tcp_443 {
		hostnames;
		default          "";
		a.example.com    "";
		*.b.example.com  192.0.2.21;
	}

	server {
		listen 443 so_keepalive=on backlog=65535;
		listen [::]:443 so_keepalive=on backlog=65535;
		ssl_preread on;
		proxy_pass $ns_up_tcp_443;
		proxy_bind $ns_src_tcp_443;	# outgoing address
		proxy_connect_timeout 5s;
		proxy_timeout 10m;	# closes idle connections
		proxy_socket_keepalive on;
		proxy_buffer_size 64k;	# default 16k: extra syscalls on a fat stream
	}

	upstream udp_203_0_113_9_443 {
		server 203.0.113.9:443 max_fails=0;
	}

	# reuseport: else one client's datagrams spread over workers and the server sees mixed sessions
	server {
		listen 443 udp reuseport rcvbuf=16m sndbuf=16m;
		listen [::]:443 udp reuseport rcvbuf=16m sndbuf=16m;
		proxy_pass udp_203_0_113_9_443;
		proxy_timeout 10m;
	}
}
