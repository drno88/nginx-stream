# nginx-stream: kernel parameters for a relay (generated; applied with: sysctl -e -p <this file>)

# BBR + fq: better throughput on lossy long-distance paths
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# socket buffers: UDP bursts must not be dropped before nginx reads them
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.tcp_rmem = 4096 131072 8388608
net.ipv4.tcp_wmem = 4096 131072 8388608

# total TCP memory: 14% of RAM in 4 KB pages, thresholds 1:2:3 (the kernel default is too low on 1 GB; above ~14% risks OOM)
net.ipv4.tcp_mem = 12233 24466 36700

# queues: many simultaneous connections
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 8192

# outgoing ports: a wide range, and our listen ports >= 10000 must not be taken by outgoing connections
net.ipv4.ip_local_port_range = 10000 65535
net.ipv4.ip_local_reserved_ports = 51820

# TCP behaviour on a relay
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 131072

# dead peers are noticed in about 11 minutes, closed sockets are released sooner
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 3
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1

# keep the relay in RAM
vm.swappiness = 10
