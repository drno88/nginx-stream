# nginx-stream: target=203.0.113.10
stream {
	access_log off;

	# max_fails=0: a short failure must not take one address of a dual-stack domain out

	upstream tcp_203_0_113_10_443 {
		server 203.0.113.10:443 max_fails=0;
	}

	server {
		listen 443 so_keepalive=on backlog=65535;
		listen [::]:443 so_keepalive=on backlog=65535;
		proxy_pass tcp_203_0_113_10_443;
		proxy_connect_timeout 5s;
		proxy_timeout 10m;	# closes idle connections
		proxy_socket_keepalive on;
		proxy_buffer_size 64k;	# default 16k: extra syscalls on a fat stream
	}

	upstream udp_203_0_113_10_443 {
		server 203.0.113.10:443 max_fails=0;
	}

	# reuseport: else one client's datagrams spread over workers and the server sees mixed sessions
	server {
		listen 443 udp reuseport rcvbuf=16m sndbuf=16m;
		listen [::]:443 udp reuseport rcvbuf=16m sndbuf=16m;
		listen 8443 udp reuseport rcvbuf=16m sndbuf=16m;
		listen [::]:8443 udp reuseport rcvbuf=16m sndbuf=16m;
		proxy_pass udp_203_0_113_10_443;
		proxy_timeout 10m;
	}
}
